name: audit-anexo3

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: write

jobs:
  ssrs-and-checklist:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal audit dependency
        run: pip install pandas==3.0.2

      - name: Validate local SSRS publication contract
        run: python src/publicar_ssrs.py

      - name: Generate canonical CGR dependency matrix
        run: python src/generar_dependencias_cgr.py

      - name: Generate Annex 3 checklist
        run: python src/generar_checklist_anexo3.py

      - name: Run final release coherence audit
        run: python src/auditar_release.py

      - name: Validate release gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checklist = json.loads(Path('outputs/checklist_anexo3.json').read_text(encoding='utf-8'))
          ssrs = json.loads(Path('outputs/ssrs_publicacion_manifest.json').read_text(encoding='utf-8'))
          deps = json.loads(Path('outputs/dependencias_cgr.json').read_text(encoding='utf-8'))
          release = json.loads(Path('outputs/auditoria_release.json').read_text(encoding='utf-8'))

          assert checklist['schema_version'] == 2
          assert checklist['resumen'].get('🔴', 0) == 0
          assert checklist['resumen'].get('✅', 0) == 6
          assert checklist['resumen'].get('🟡', 0) == 4
          assert checklist['resumen'].get('🔵', 0) == 1
          assert len(checklist['criterios']) == 11
          assert all(
              c.get('dependencias_cgr')
              for c in checklist['criterios']
              if c['estado'] in {'🟡', '🔵'}
          )

          assert deps['total'] == 8
          assert [d['id'] for d in deps['dependencias']] == [f'CGR-DEP-{i:02d}' for i in range(1, 9)]

          assert ssrs['validacion']['conteos_tablas']['PrediccionesFavoritismo'] > 0
          assert ssrs['validacion']['conteos_tablas']['PrediccionesFraccionamiento'] > 0
          assert ssrs['validacion']['conteos_tablas']['VinculosProveedorFuncionario'] > 0

          assert release['release_ready'] is True
          assert release['checks_fallidos'] == 0
          assert release['checks_ok'] == release['total_checks']
          print(
              f"Release gate: {release['checks_ok']}/{release['total_checks']} checks OK; "
              "Anexo 3 = 6 ✅ / 4 🟡 / 1 🔵 / 0 🔴"
          )
          PY

      - name: Upload release audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-release-candidate
          path: |
            outputs/ssrs_publicacion_manifest.json
            outputs/checklist_anexo3.json
            outputs/dependencias_cgr.json
            outputs/auditoria_release.json
            docs/Checklist_Anexo_03.md
            docs/Dependencias_Institucionales_CGR.md
            docs/Auditoria_Final_Release.md
          retention-days: 30

      - name: Persist final audit evidence in main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            outputs/ssrs_publicacion_manifest.json \
            outputs/checklist_anexo3.json \
            outputs/dependencias_cgr.json \
            outputs/auditoria_release.json \
            docs/Checklist_Anexo_03.md \
            docs/Dependencias_Institucionales_CGR.md \
            docs/Auditoria_Final_Release.md
          if git diff --cached --quiet; then
            echo "Auditoría final sin cambios."
          else
            git commit -m "chore: persistir auditoría final release candidate [skip ci]"
            git push
          fi
