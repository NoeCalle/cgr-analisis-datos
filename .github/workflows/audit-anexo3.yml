name: audit-anexo3

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

# Por defecto, incluso un workflow_run originado por PR solo dispone de lectura.
permissions:
  contents: read
  actions: read

jobs:
  reject-untrusted-source:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event != 'push' || github.event.workflow_run.head_branch != 'main')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject non push/main source
        run: |
          echo "audit-anexo3 privilegiado solo acepta tests exitosos originados por push a main."
          exit 1

  ssrs-and-checklist:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify triggering SHA is still current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          EVENT_SHA='${{ github.event.workflow_run.head_sha }}'
          CHECKED_SHA=$(git rev-parse HEAD)
          REMOTE_MAIN=$(git rev-parse origin/main)
          echo "event_sha=$EVENT_SHA"
          echo "checked_sha=$CHECKED_SHA"
          echo "remote_main=$REMOTE_MAIN"
          if [[ "$CHECKED_SHA" != "$EVENT_SHA" || "$REMOTE_MAIN" != "$EVENT_SHA" ]]; then
            echo "El workflow tests ya no corresponde al main vigente; se aborta persistencia privilegiada."
            exit 1
          fi

      - name: Download persistable tree from exact tests run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: persistable-verified-tree
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install minimal audit dependency
        run: pip install pandas==3.0.2

      - name: Validate local SSRS publication contract
        run: python src/publicar_ssrs.py

      - name: Generate canonical CGR dependency matrix
        run: python src/generar_dependencias_cgr.py

      - name: Generate Annex 3 checklist
        run: python src/generar_checklist_anexo3.py

      - name: Audit complete public TDR
        run: python src/auditar_tdr_completo.py

      - name: Synchronize README release status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          start = '<!-- RELEASE-CANDIDATE-START -->'
          end = '<!-- RELEASE-CANDIDATE-END -->'
          block = f'''{start}
          ## Release candidate histórico

          Versión declarada del snapshot original del PoC independiente: **`v{version}`**.

          Si el tag ya existe, permanece como snapshot histórico e inmutable y no se mueve con las mejoras posteriores de `main`. El estado funcional vigente de la herramienta se documenta en las secciones superiores de este README.

          Referencias del ecosistema de release:

          - `RELEASE_NOTES.md` — alcance histórico y límites de la versión;
          - `docs/Checklist_Anexo_03.md` — 11 criterios del Anexo 3;
          - `docs/Dependencias_Institucionales_CGR.md` — fuente única `CGR-DEP-01..08` de dependencias institucionales;
          - `docs/Auditoria_Final_Release.md` — gate de coherencia del estado actual de `main` frente a la VERSION declarada;
          - `outputs/auditoria_release.json` — resultado machine-readable del gate.

          El tag histórico no representa aprobación ni despliegue institucional de la CGR.
          {end}'''
          block = '\n'.join(line.strip() if line.startswith('          ') else line for line in block.splitlines())

          if start in text and end in text:
              before = text.split(start, 1)[0].rstrip()
              after = text.split(end, 1)[1].lstrip()
              text = before + '\n\n' + block + '\n\n' + after
          else:
              marker = '## Documentación'
              if marker not in text:
                  raise SystemExit('README: no se encontró el marcador de Documentación')
              text = text.replace(marker, block + '\n\n' + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run final release coherence audit
        run: python src/auditar_release.py

      - name: Validate release and full TDR gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checklist = json.loads(Path('outputs/checklist_anexo3.json').read_text(encoding='utf-8'))
          full_tdr = json.loads(Path('outputs/auditoria_tdr_completo.json').read_text(encoding='utf-8'))
          ssrs = json.loads(Path('outputs/ssrs_publicacion_manifest.json').read_text(encoding='utf-8'))
          deps = json.loads(Path('outputs/dependencias_cgr.json').read_text(encoding='utf-8'))
          release = json.loads(Path('outputs/auditoria_release.json').read_text(encoding='utf-8'))

          assert checklist['schema_version'] == 2
          assert checklist['resumen'].get('🔴', 0) == 0
          assert checklist['resumen'].get('✅', 0) == 6
          assert checklist['resumen'].get('🟡', 0) == 4
          assert checklist['resumen'].get('🔵', 0) == 1
          assert len(checklist['criterios']) == 11
          assert all(
              c.get('dependencias_cgr')
              for c in checklist['criterios']
              if c['estado'] in {'🟡', '🔵'}
          )

          assert full_tdr['schema_version'] == 2
          assert full_tdr['total_criterios'] == 25
          assert full_tdr['repo_closable_gaps'] == 0
          assert full_tdr['resumen'].get('🔴', 0) == 0
          assert all(
              c.get('dependencias_cgr')
              for c in full_tdr['criterios']
              if c['estado'] in {'🟡', '🔵'}
          )

          assert deps['total'] == 8
          assert [d['id'] for d in deps['dependencias']] == [f'CGR-DEP-{i:02d}' for i in range(1, 9)]

          assert ssrs['validacion']['conteos_tablas']['PrediccionesFavoritismo'] > 0
          assert ssrs['validacion']['conteos_tablas']['PrediccionesFraccionamiento'] > 0
          assert ssrs['validacion']['conteos_tablas']['VinculosProveedorFuncionario'] > 0

          assert release['release_ready'] is True
          assert release['checks_fallidos'] == 0
          assert release['checks_ok'] == release['total_checks']
          print(
              f"Gates OK: release={release['checks_ok']}/{release['total_checks']}; "
              f"Anexo3=6/4/1/0; TDR completo={full_tdr['resumen']}"
          )
          PY

      - name: Upload release and full TDR audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencia-release-candidate
          path: |
            outputs/ssrs_publicacion_manifest.json
            outputs/checklist_anexo3.json
            outputs/dependencias_cgr.json
            outputs/auditoria_tdr_completo.json
            outputs/auditoria_release.json
            docs/Checklist_Anexo_03.md
            docs/Dependencias_Institucionales_CGR.md
            docs/Auditoria_TDR_Completo.md
            docs/Auditoria_Final_Release.md
            README.md
          retention-days: 30

      - name: Persist verified artifacts and final audit evidence in main
        shell: bash
        run: |
          set -euo pipefail
          EVENT_SHA='${{ github.event.workflow_run.head_sha }}'
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$EVENT_SHA" ]]; then
            echo "main avanzó antes del commit; se aborta para no mezclar evidencia de distintos SHA."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch \
            outputs/models/modelo_favoritismo_spark_rf \
            outputs/models/modelo_fraccionamiento_spark_kmeans
          git rm --ignore-unmatch outputs/models/modelo_favoritismo_rf_v2_con_drift.joblib
          git rm --ignore-unmatch \
            lakehouse/oro/dataset_favoritismo.csv \
            lakehouse/oro/dataset_fraccionamiento.csv

          git add -A README.md data lakehouse outputs docs reporte

          if git diff --cached --quiet; then
            echo "Artefactos y auditorías sin cambios."
          else
            git commit -m "chore: persistir artefactos y auditorías verificados [skip ci]"
            git push origin HEAD:main
          fi
