name: documentation-sanitize-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize stale documentation references
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tests.yml')
          text = workflow.read_text(encoding='utf-8')

          replacements = {
              'Perfil sklearn de compatibilidad Sprint 4 OK': 'Perfil sklearn de compatibilidad OK',
              'TRAIN Spark aislado Sprint 4 OK': 'TRAIN Spark aislado OK',
              '- name: Promote Sprint 4 Spark champion and smoke operational inference': '- name: Promote Spark champion and smoke operational inference',
              'Sprint 4 serving Spark MLlib OK: candidate promovido, monto P99 congelado': 'Serving Spark MLlib OK: candidate promovido, monto P99 congelado',
              '- name: Validate reproducibility and Sprint 4 artifacts': '- name: Validate reproducibility and current artifacts',
              'Reproducibilidad legacy + Spark/GraphFrames + pagos/modalidades Sprint 4 OK': 'Reproducibilidad legacy + Spark/GraphFrames + pagos/modalidades OK',
              '- name: Enrich formal DOCX with Sprint 4 payments analysis': '- name: Enrich formal DOCX with current payments and architecture',
              "assert 'ANEXO TÉCNICO SPRINT 4' in text, f'{pdf.name}: falta anexo Sprint 4'": "assert 'ANEXO TÉCNICO — PAGOS, MODALIDADES Y ARQUITECTURA OPERACIONAL' in text, f'{pdf.name}: falta anexo técnico operacional'",
              "assert text.rfind('Referencias Bibliográficas') > text.rfind('ANEXO TÉCNICO SPRINT 4')": "assert text.rfind('Referencias Bibliográficas') > text.rfind('ANEXO TÉCNICO — PAGOS, MODALIDADES Y ARQUITECTURA OPERACIONAL')",
              "print(f'DOCX/PDF smoke Sprint 4: {len(pdfs)} documentos verificados')": "print(f'DOCX/PDF smoke documental: {len(pdfs)} documentos verificados')",
              'git commit -m "chore: regenerar artefactos Sprint 4 verificados [skip ci]"': 'git commit -m "chore: regenerar artefactos verificados [skip ci]"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'No se encontró patrón esperado en tests.yml: {old}')
              text = text.replace(old, new)

          audit_old = "      - name: Audit complete public TDR\n        run: python src/auditar_tdr_completo.py\n"
          audit_new = "      - name: Regenerate documentation audits\n        run: |\n          python src/generar_dependencias_cgr.py\n          python src/generar_checklist_anexo3.py\n          python src/auditar_tdr_completo.py\n          python src/auditar_release.py\n"
          if audit_old not in text:
              raise SystemExit('No se encontró el bloque de auditoría TDR esperado')
          text = text.replace(audit_old, audit_new)

          upload_anchor = "            outputs/auditoria_tdr_completo.json\n            docs/Auditoria_TDR_Completo.md\n"
          upload_extra = upload_anchor + "            outputs/checklist_anexo3.json\n            docs/Checklist_Anexo_03.md\n            outputs/dependencias_cgr.json\n            docs/Dependencias_Institucionales_CGR.md\n            outputs/auditoria_release.json\n            docs/Auditoria_Final_Release.md\n"
          if text.count(upload_anchor) != 1:
              raise SystemExit(f'Se esperaba 1 anchor en upload de auditoría, encontrados: {text.count(upload_anchor)}')
          text = text.replace(upload_anchor, upload_extra)

          lines = text.splitlines()
          out = []
          persist_inserted = False
          for line in lines:
              out.append(line)
              if line.strip() == 'docs/Auditoria_TDR_Completo.md \\':
                  out.extend([
                      '            outputs/checklist_anexo3.json \\',
                      '            docs/Checklist_Anexo_03.md \\',
                      '            outputs/dependencias_cgr.json \\',
                      '            docs/Dependencias_Institucionales_CGR.md \\',
                      '            outputs/auditoria_release.json \\',
                      '            docs/Auditoria_Final_Release.md \\',
                  ])
                  persist_inserted = True
          if not persist_inserted:
              raise SystemExit('No se encontró el punto de inserción en git add')
          workflow.write_text('\n'.join(out) + '\n', encoding='utf-8')

          productos = Path('reporte/generar_productos_formales.js')
          ptext = productos.read_text(encoding='utf-8')
          product_replacements = {
              'Además, la implementación objetivo del TDR se ejecutó con Apache Spark MLlib en modo local reproducible.': 'La evidencia histórica de Spark MLlib se reproduce en local[*], mientras que la ruta operacional vigente admite master configurable y spark_sql Spark-native sin toPandas().',
              'La arquitectura implementada sigue fuente -> Bronce -> limpieza/feature engineering -> Plata -> modelo -> Oro -> reporting/trazabilidad. El mismo dataset Plata es consumido por el benchmark sklearn y por la implementación Spark MLlib.': 'El PoC conserva una ruta histórica fuente -> Bronce -> limpieza/feature engineering -> Plata -> benchmark -> Oro para reproducibilidad y una ruta operacional fuente canónica -> TRAIN/INFERENCE -> champion Spark -> scores. El serving operacional no depende de materializar la fuente spark_sql en pandas o en la Plata legacy.',
              'Contenido exigido por el TDR implementado y verificado para el PoC, incluida una ejecución Spark MLlib real en local[*]. La validación de escalabilidad sobre HDFS/YARN institucional queda pendiente de infraestructura CGR.': 'Contenido exigido por el TDR implementado y verificado para el PoC, con benchmark MLlib local reproducible y contrato operacional Spark-native. La validación de escalabilidad, carga y rendimiento sobre infraestructura institucional queda pendiente de la CGR.',
              'Random Forest es el candidato técnico preferido del PoC por AUC-PR e interpretabilidad. Spark MLlib ya forma parte de la ruta ejecutable, pero la prueba distribuida y los umbrales productivos requieren el entorno CGR.': 'Random Forest es el candidato técnico preferido del PoC por AUC-PR e interpretabilidad. Spark MLlib forma parte tanto del benchmark histórico como del serving operacional; la validación de carga, rendimiento y umbrales productivos requiere el entorno CGR.',
          }
          for old, new in product_replacements.items():
              if old not in ptext:
                  raise SystemExit(f'No se encontró patrón esperado en generar_productos_formales.js: {old}')
              ptext = ptext.replace(old, new)
          productos.write_text(ptext, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit sanitation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/documentation-sanitize-once.yml
          git add .github/workflows/tests.yml reporte/generar_productos_formales.js
          git diff --check
          git commit -m "chore: sanear referencias documentales y CI"
          git push
