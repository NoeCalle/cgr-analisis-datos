name: airflow-dags

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dagbag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-airflow.txt

      - name: Install pinned Airflow runtime with official constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-airflow.txt \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.12.txt

      - name: Import all DAGs with DagBag
        env:
          AIRFLOW_HOME: /tmp/cgr-airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
        run: |
          python - <<'PY'
          from airflow.models import DagBag

          expected = {
              'reproducibilidad_poc_1_8_2',
              'entrenamiento_candidato_1_8_2',
              'inferencia_modelos_1_8_2',
              'monitoreo_reentrenamiento_1_8_2',
          }
          bag = DagBag(dag_folder='airflow_home/dags', include_examples=False, safe_mode=False)
          assert not bag.import_errors, bag.import_errors
          missing = expected - set(bag.dags)
          assert not missing, f'DAGs faltantes: {sorted(missing)}'

          for dag_id in {
              'entrenamiento_candidato_1_8_2',
              'inferencia_modelos_1_8_2',
              'monitoreo_reentrenamiento_1_8_2',
          }:
              assert bag.dags[dag_id].max_active_runs == 1, dag_id

          monitor = bag.dags['monitoreo_reentrenamiento_1_8_2']
          assert monitor.schedule is None, (
              'En CI, sin CGR_MONITOR_SCHEDULE, el monitor no debe quedar agendado '
              'automáticamente.'
          )
          print(f'DagBag OK: {sorted(expected)}')
          PY
