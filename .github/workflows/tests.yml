name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas==3.0.2 \
            numpy==2.4.4 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            pytest==9.0.2 \
            python-docx==1.2.0

      - name: Run regression tests
        run: pytest -q

      - name: Rebuild synthetic data and publish Plata
        run: |
          python src/generar_datos.py
          python src/preprocesamiento.py
          python src/lakehouse_capas.py bronce
          python src/lakehouse_capas.py plata

      - name: Run model-selection smoke tests
        run: |
          python src/comparar_modelos_favoritismo.py
          python src/tuning_favoritismo.py
          python src/tuning_fraccionamiento.py

      - name: Build documentary evidence
        run: python src/generar_evidencia_documental.py

      - name: Validate P1 artifacts
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          fav = pd.read_csv('lakehouse/plata/dataset_favoritismo.csv')
          frac = pd.read_csv('lakehouse/plata/dataset_fraccionamiento.csv')
          assert 'pct_contratacion_directa' in fav.columns
          assert 'pct_comparacion_precios' in fav.columns
          assert 'pct_no_competitiva' not in fav.columns
          assert fav['label_favoritismo_real'].sum() > 0
          assert frac['label_fraccionamiento_real'].sum() > 0

          with open('outputs/comparacion_modelos_favoritismo.json', encoding='utf-8') as f:
              comparacion = json.load(f)
          with open('outputs/tuning_favoritismo_resumen.json', encoding='utf-8') as f:
              fav_tuning = json.load(f)
          with open('outputs/tuning_fraccionamiento_resumen.json', encoding='utf-8') as f:
              frac_tuning = json.load(f)
          with open('outputs/evidencia_documental.json', encoding='utf-8') as f:
              evidencia = json.load(f)

          assert len(comparacion['resultados']) == 3
          assert fav_tuning['mejor_configuracion']
          assert frac_tuning['metrica_seleccion'].startswith('AUC-PR')
          metricas = frac_tuning['metricas_holdout_final']
          for campo in ['recall_at_k', 'auc_roc', 'auc_pr', 'precision', 'recall', 'f1']:
              assert campo in metricas

          assert evidencia['validacion_datos_publicos']['integridad_ocds']['contratos_analiticos_validos'] == 47254
          assert evidencia['criterios_documentales']['permitir_conteo_obsoleto_solo_como_antecedente_explicito'] is True
          print('Smoke P1 + evidencia documental OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reporte/package-lock.json

      - name: Generate formal DOCX
        working-directory: reporte
        run: |
          npm ci
          npm run all

      - name: Validate generated DOCX content
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          files = [Path('reporte/Reporte_Tecnico_Prototipo_CGR_1.8.2.docx')]
          files += sorted(Path('reporte/productos_formales').glob('Producto_*.docx'))
          assert len(files) == 8, files

          banned = [
              'pct_no_competitiva',
              'AUC-ROC = 1.00',
              'AUC-PR = 1.00',
              'S/. 400,000',
              'reentrenado automáticamente',
          ]
          texts = {}
          for f in files:
              doc = Document(f)
              text = '\n'.join(p.text for p in doc.paragraphs)
              for table in doc.tables:
                  for row in table.rows:
                      text += '\n' + ' | '.join(cell.text for cell in row.cells)
              texts[f.name] = text
              for token in banned:
                  assert token not in text, f'{f}: contiene texto obsoleto: {token}'
              assert 'prototipo' in text.lower()

          reporte = texts['Reporte_Tecnico_Prototipo_CGR_1.8.2.docx']
          assert '47,254' in reporte, 'El reporte no muestra el conteo vigente 47,254'
          if '47,442' in reporte:
              assert 'conteo antiguo' in reporte and 'fue descartado' in reporte, (
                  '47,442 solo puede aparecer como antecedente explícitamente descartado'
              )

          print(f'DOCX validados: {len(files)}')
          PY

      - name: Upload model-selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-evidence
          path: |
            outputs/comparacion_modelos_favoritismo.json
            outputs/comparacion_modelos_favoritismo.csv
            outputs/tuning_favoritismo_resumen.json
            outputs/tuning_favoritismo_resultados.csv
            outputs/tuning_fraccionamiento_resumen.json
            outputs/tuning_fraccionamiento_resultados.csv
            outputs/evidencia_documental.json
          retention-days: 14

      - name: Upload regenerated formal documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-formal-regenerada
          path: |
            reporte/Reporte_Tecnico_Prototipo_CGR_1.8.2.docx
            reporte/productos_formales/Producto_*.docx
          retention-days: 14
