name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pytest-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas==3.0.2 \
            numpy==2.4.4 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            matplotlib==3.10.8 \
            shap==0.52.0 \
            networkx==3.6.1 \
            pytest==9.0.2 \
            python-docx==1.2.0

      - name: Run regression tests
        run: pytest -q

      - name: Rebuild synthetic data and publish Plata
        run: |
          python src/generar_datos.py
          python src/preprocesamiento.py
          python src/lakehouse_capas.py bronce
          python src/lakehouse_capas.py plata

      - name: Run model selection and training
        run: |
          python src/comparar_modelos_favoritismo.py
          python src/tuning_favoritismo.py
          python src/tuning_fraccionamiento.py
          python src/modelo_favoritismo.py
          python src/modelo_fraccionamiento.py
          python src/modelo_grafos.py
          python src/lakehouse_capas.py oro

      - name: Build documentary evidence
        run: python src/generar_evidencia_documental.py

      - name: Validate P1 artifacts
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          fav = pd.read_csv('lakehouse/plata/dataset_favoritismo.csv')
          frac = pd.read_csv('lakehouse/plata/dataset_fraccionamiento.csv')
          ranking_fav = pd.read_csv('outputs/ranking_riesgo_favoritismo.csv')
          ranking_frac = pd.read_csv('outputs/ranking_riesgo_fraccionamiento.csv')

          assert 'pct_contratacion_directa' in fav.columns
          assert 'pct_comparacion_precios' in fav.columns
          assert 'pct_no_competitiva' not in fav.columns
          assert 'pct_no_competitiva' not in ranking_fav.columns
          assert fav['label_favoritismo_real'].sum() == 6
          assert len(fav) == 2328
          assert frac['label_fraccionamiento_real'].sum() == 8
          assert len(frac) == 180
          assert len(ranking_fav) == len(fav)
          assert len(ranking_frac) == len(frac)

          with open('outputs/comparacion_modelos_favoritismo.json', encoding='utf-8') as f:
              comparacion = json.load(f)
          with open('outputs/tuning_favoritismo_resumen.json', encoding='utf-8') as f:
              fav_tuning = json.load(f)
          with open('outputs/tuning_fraccionamiento_resumen.json', encoding='utf-8') as f:
              frac_tuning = json.load(f)
          with open('outputs/evidencia_documental.json', encoding='utf-8') as f:
              evidencia = json.load(f)

          assert len(comparacion['resultados']) == 3
          assert comparacion['resultados'][0]['modelo'] == 'RandomForest'
          assert abs(comparacion['resultados'][0]['auc_pr'] - 0.6714285714285714) < 1e-12
          assert fav_tuning['mejor_configuracion']
          assert frac_tuning['metrica_seleccion'].startswith('AUC-PR')
          metricas = frac_tuning['metricas_holdout_final']
          for campo in ['recall_at_k', 'auc_roc', 'auc_pr', 'precision', 'recall', 'f1']:
              assert campo in metricas

          assert evidencia['validacion_datos_publicos']['integridad_ocds']['contratos_analiticos_validos'] == 47254
          assert evidencia['criterios_documentales']['permitir_conteo_obsoleto_solo_como_antecedente_explicito'] is True
          print('Smoke P1/P2 + datos + rankings + evidencia documental OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reporte/package-lock.json

      - name: Generate formal DOCX
        working-directory: reporte
        run: |
          npm ci
          npm run all

      - name: Validate generated DOCX content
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          files = [Path('reporte/Reporte_Tecnico_Prototipo_CGR_1.8.2.docx')]
          files += sorted(Path('reporte/productos_formales').glob('Producto_*.docx'))
          assert len(files) == 8, files

          banned = [
              'pct_no_competitiva',
              'AUC-ROC = 1.00',
              'AUC-PR = 1.00',
              'S/. 400,000',
              'reentrenado automáticamente',
          ]
          texts = {}
          for f in files:
              doc = Document(f)
              text = '\n'.join(p.text for p in doc.paragraphs)
              for table in doc.tables:
                  for row in table.rows:
                      text += '\n' + ' | '.join(cell.text for cell in row.cells)
              texts[f.name] = text
              for token in banned:
                  assert token not in text, f'{f}: contiene texto obsoleto: {token}'
              assert 'prototipo' in text.lower()

          reporte = texts['Reporte_Tecnico_Prototipo_CGR_1.8.2.docx']
          assert '47,254' in reporte, 'El reporte no muestra el conteo vigente 47,254'
          assert 'AUC-PR 0.671' in reporte, 'El reporte no muestra la métrica RF reproducida con el entorno pinneado'
          if '47,442' in reporte:
              assert 'conteo antiguo' in reporte and 'fue descartado' in reporte, (
                  '47,442 solo puede aparecer como antecedente explícitamente descartado'
              )

          print(f'DOCX validados: {len(files)}')
          PY

      - name: Upload model-selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-evidence
          path: |
            outputs/comparacion_modelos_favoritismo.json
            outputs/comparacion_modelos_favoritismo.csv
            outputs/tuning_favoritismo_resumen.json
            outputs/tuning_favoritismo_resultados.csv
            outputs/tuning_fraccionamiento_resumen.json
            outputs/tuning_fraccionamiento_resultados.csv
            outputs/evidencia_documental.json
          retention-days: 14

      - name: Upload regenerated formal documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-formal-regenerada
          path: |
            reporte/Reporte_Tecnico_Prototipo_CGR_1.8.2.docx
            reporte/productos_formales/Producto_*.docx
          retention-days: 14

      - name: Persist verified reproducible artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/contratos_siaf_seace.csv \
            data/contratos_procesados.csv \
            data/dataset_favoritismo.csv \
            data/dataset_fraccionamiento.csv \
            data/proveedores.csv \
            data/entidades.csv \
            data/funcionarios.csv \
            lakehouse/bronce/contratos_siaf_seace.csv \
            lakehouse/bronce/proveedores.csv \
            lakehouse/bronce/entidades.csv \
            lakehouse/bronce/funcionarios.csv \
            lakehouse/plata/contratos_procesados.csv \
            lakehouse/plata/dataset_favoritismo.csv \
            lakehouse/plata/dataset_fraccionamiento.csv \
            lakehouse/plata/proveedores.csv \
            lakehouse/plata/entidades.csv \
            lakehouse/plata/funcionarios.csv \
            lakehouse/plata/proveedores_contacto.csv \
            lakehouse/plata/funcionarios_contacto.csv \
            outputs/ranking_riesgo_favoritismo.csv \
            outputs/ranking_riesgo_fraccionamiento.csv \
            outputs/ranking_vinculos_proveedor_funcionario.csv \
            lakehouse/oro/ranking_riesgo_favoritismo.csv \
            lakehouse/oro/ranking_riesgo_fraccionamiento.csv \
            lakehouse/oro/ranking_vinculos_proveedor_funcionario.csv \
            outputs/comparacion_modelos_favoritismo.json \
            outputs/comparacion_modelos_favoritismo.csv \
            outputs/tuning_favoritismo_resumen.json \
            outputs/tuning_favoritismo_resultados.csv \
            outputs/tuning_fraccionamiento_resumen.json \
            outputs/tuning_fraccionamiento_resultados.csv \
            outputs/evidencia_documental.json \
            reporte/Reporte_Tecnico_Prototipo_CGR_1.8.2.docx \
            reporte/productos_formales/Producto_*.docx

          if git diff --cached --quiet; then
            echo "No hay artefactos verificados nuevos que persistir."
          else
            git commit -m "chore: regenerar artefactos reproducibles verificados [skip ci]"
            git push
          fi
